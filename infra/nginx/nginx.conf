server {
    listen 80;
    server_name aviator.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name aviator.example.com;

    ssl_certificate     /etc/letsencrypt/live/aviator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aviator.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # SPA static files (React build)
    root /opt/aviator/build;
    index index.html;

    # API — 30s timeout (recharge / crypto webhooks may be slow)
    location /api/ {
        proxy_pass         http://127.0.0.1:18805;
        proxy_read_timeout 30s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO websocket upgrade — long-lived, BET phase idle
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:18805;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Public health probe
    location = /health {
        proxy_pass http://127.0.0.1:18805/health;
        access_log off;
    }

    # Cache static assets (CRA hashes filenames)
    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown route → index.html (admin / mock-pay etc)
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 256k;
    server_tokens off;
}
