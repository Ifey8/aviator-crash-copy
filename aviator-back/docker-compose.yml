services:
  mongo:
    image: mongo:7
    container_name: aviator-mongo
    restart: unless-stopped
    ports:
      # Host port → container port. Override host side via $MONGO_PORT.
      # Container always listens on 27017 internally.
      - "${MONGO_PORT:-18827}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: aviator-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Pull values from ./.env (gitignored) FIRST, then the inline `environment`
    # overrides. So sensitive keys (TRON_USDT_RECEIVER, RAZORPAY_*) live in
    # .env and are not committed.
    env_file:
      - .env
    environment:
      # PORT inside the container — Node listens here.
      # `mongodb://mongo:27017/aviator` is docker-network DNS, NOT affected
      # by host port remapping (mongo container still listens on 27017).
      PORT: ${API_PORT:-18805}
      MONGO_URI: mongodb://mongo:27017/aviator
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:18803}
      # ALLOW_DEV_AUTH intentionally NOT set here — it's read from .env so
      # prod can set =false (default) without touching this file. Setting
      # it to "true" here would override .env and spawn guest users on prod.
      INITIAL_BALANCE: 1000
      MIN_BET: 1
      MAX_BET: 1000
      BET_DURATION_MS: 5000
      SETTLE_DURATION_MS: 3000
      HOUSE_EDGE: 0.03
    ports:
      - "${API_PORT:-18805}:${API_PORT:-18805}"

volumes:
  mongo_data:
