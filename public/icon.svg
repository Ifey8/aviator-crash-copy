<?xml version="1.0" encoding="UTF-8"?>
<!--
  Aviator app icon — a Mughal-style gold medallion with a stylised cartoon
  plane at the centre. Square 80×80 viewBox; scales cleanly from 16px
  (favicon) to 512px (PWA / Apple-Touch). Self-contained, no externals.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 80"
  width="80"
  height="80"
  role="img"
  aria-label="Aviator"
>
  <defs>
    <!-- Gold disc — pale highlight at top, deep ember at bottom -->
    <radialGradient id="discBg" cx="42%" cy="32%" r="78%">
      <stop offset="0%"  stop-color="#FFF5D4" />
      <stop offset="32%" stop-color="#FBD667" />
      <stop offset="68%" stop-color="#D4A83F" />
      <stop offset="100%" stop-color="#6B4A0E" />
    </radialGradient>

    <!-- Plane fuselage — saffron orange to deep crimson -->
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE3A1" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#C12244" />
    </linearGradient>

    <!-- Wing — navy with a touch of highlight -->
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3B5BB8" />
      <stop offset="100%" stop-color="#10215A" />
    </linearGradient>

    <!-- Inset shadow for depth on the medallion -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="80%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(58,40,7,0.45)" />
    </radialGradient>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="40" cy="40" r="38" fill="url(#discBg)" />
  <!-- Engraved inner shadow -->
  <circle cx="40" cy="40" r="38" fill="url(#vignette)" />
  <!-- Engraved inner ring -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#6B4A0E" stroke-width="0.7" opacity="0.65" />
  <circle cx="40" cy="40" r="32.6" fill="none" stroke="#FFF5D4" stroke-width="0.4" opacity="0.55" />

  <!-- Four cardinal star pip ornaments (Mughal-medallion hint) -->
  <g fill="#6B4A0E" opacity="0.55">
    <circle cx="40" cy="6.5" r="1.1" />
    <circle cx="40" cy="73.5" r="1.1" />
    <circle cx="6.5" cy="40" r="1.1" />
    <circle cx="73.5" cy="40" r="1.1" />
  </g>

  <!-- Plane mascot, centered -->
  <g transform="translate(13 24)">
    <!-- horizontal tail stabilizer -->
    <path
      d="M 0 11 Q -3 8 0 5 L 7 6 L 7 14 L 0 13 Z"
      fill="url(#wingG)"
      stroke="#FFC857"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <!-- vertical fin -->
    <path
      d="M 5 4 L 7 -3 Q 10 -4 13 -3 L 14 4 Z"
      fill="#9B1A36"
      stroke="#FFC857"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <!-- main wing (sweepback) -->
    <path
      d="M 17 14 Q 27 17 38 17 Q 35 27 23 28 Q 14 27 13 21 Z"
      fill="url(#wingG)"
      stroke="#FFC857"
      stroke-width="0.7"
      stroke-linejoin="round"
    />
    <!-- fuselage -->
    <path
      d="M 6 12 Q 6 6 13 6 L 40 6 Q 49 6 49 12 Q 49 18 40 18 L 13 18 Q 6 18 6 12 Z"
      fill="url(#bodyG)"
      stroke="#5A0610"
      stroke-width="0.7"
      stroke-linejoin="round"
    />
    <!-- cockpit window -->
    <path
      d="M 27 8 Q 28 6 32 6 L 38 6.5 Q 40 8 40 11 Q 40 13 36 13 L 30 13 Q 26 12 27 8 Z"
      fill="#E7EEFC"
      stroke="#1E3A8A"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
    <!-- cockpit specular highlight -->
    <path
      d="M 28 8.5 Q 30 7.5 33 7.5"
      stroke="#FFFFFF"
      stroke-width="0.8"
      fill="none"
      stroke-linecap="round"
      opacity="0.9"
    />
    <!-- gold belly trim -->
    <path
      d="M 9 16 Q 27 19 47 15"
      stroke="#FFC857"
      stroke-width="0.6"
      fill="none"
      stroke-linecap="round"
      opacity="0.9"
    />
    <!-- propeller hub -->
    <circle cx="50" cy="12" r="2.4" fill="#FFC857" stroke="#5A0610" stroke-width="0.5" />
    <circle cx="50" cy="12" r="1.2" fill="#C12244" />
  </g>
</svg>
